name: CI

# Los cuatro gates del proyecto, corridos por una máquina en cada PR.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gates:
    name: ${{ matrix.config.name }} · typecheck · lint · test · build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: default
            channels: ""
            agenda: ""
          - name: completo
            channels: "whatsapp,instagram,messenger"
            agenda: "on"

    env:
      CHANNELS: ${{ matrix.config.channels }}
      AGENDA: ${{ matrix.config.agenda }}

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm typecheck
      - name: lint
        if: ${{ !cancelled() }}
        run: pnpm lint
      - name: test
        if: ${{ !cancelled() }}
        run: pnpm test
      - name: build
        if: ${{ !cancelled() }}
        run: pnpm build

  visual:
    name: visual · escritorio + móvil
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHANNELS: "whatsapp,instagram,messenger"
      AGENDA: "on"
      PARLEY_VISUAL_TEST: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      TZ: "America/Santiago"

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: instalar Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: build visual
        run: pnpm build
      - name: validar regresión visual V07
        run: pnpm test:visual
      - name: guardar diferencias V07
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-differences
          path: scratch/visual
          if-no-files-found: warn
          retention-days: 7
